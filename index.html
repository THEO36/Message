<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Viewport meta tag for mobile responsiveness -->
  <title>Glowing Input Example</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      max-width: 100%;
      padding: 10px;
    }

    .input-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-direction: column; /* Stack input and button vertically */
    }

    input[type="text"] {
      padding: 10px 20px;
      border: none;
      border-radius: 30px;
      outline: none;
      background: #1f1f1f;
      color: #fff;
      font-size: 18px;
      width: 100%; /* Make the input take up full width */
      max-width: 300px; /* Max width to prevent it getting too big */
      box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
      transition: 0.3s;
    }

    input[type="text"]:focus {
      box-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 30px;
      background: #00ffff;
      color: #000;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
      transition: 0.3s;
      margin-top: 10px;
    }

    button:hover {
      box-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff;
    }

    .response {
      color: #00ff99;
      font-size: 34px;
      min-height: 50px;
      height: 50px;
      line-height: 50px;
      margin-bottom: 50px;
      white-space: pre-line;
      overflow: hidden;
      transition: opacity 2s;
    }

    /* Media queries for responsiveness */
    @media (max-width: 480px) {
      input[type="text"] {
        font-size: 16px; /* Adjust font size for small screens */
        max-width: 80%; /* Allow the input to be slightly smaller */
      }

      button {
        font-size: 16px; /* Adjust button font size */
        width: 100%; /* Make the button full width */
        max-width: 80%; /* Same as input field for consistency */
      }

      .response {
        font-size: 28px; /* Adjust response font size */
        margin-bottom: 30px; /* Smaller margin to fit mobile screens better */
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="response" class="response"></div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type something...">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const sendBtn = document.getElementById('sendBtn');
      const userInput = document.getElementById('userInput');
      const response = document.getElementById('response');
      
      let isTyping = false; // new: prevent sending if still typing

      function handleSend() {
        if (isTyping) return; // block sending if a reply is still typing
        
        const input = userInput.value.trim();
        if (input === '') return; // prevent sending empty input

        const lowerInput = input.toLowerCase();
        let reply = '';

        // Keyword matching, case-insensitive
        if (lowerInput === 'hello') {
          reply = 'Hi';
        } else if (lowerInput === 'how are you') {
          reply = "I'm doing great!";
        } else if (lowerInput === 'bye') {
          reply = "Goodbye!";
        } else if (lowerInput === 'what is your name?') {
          reply = "I don't know, what is yours?";
        } else if (lowerInput === 'elijah') {
          reply = "Hello, Creator";
        } else if (lowerInput === 'jack') {
          reply = "...What a poor soul";
        } else if (lowerInput === 'quyên') {
          reply = "con báo tinh nghịch";
        } else if (lowerInput === 'yin') {
          reply = "Hello, Son";
        } else if (lowerInput === 'yang') {
          reply = "Hello, Daughter";
        } else if (lowerInput === 'blake') {
          reply = "Hello, old man";
        } else {
          reply = "I don't understand.";
        }
 
        // Animate typing
        typeText(reply);

        // Clear input
        userInput.value = '';
      }

      sendBtn.addEventListener('click', handleSend);

      userInput.addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          handleSend();
        }
      });

      function typeText(text) {
        response.textContent = '';
        response.style.opacity = 1;
        let index = 0;
        isTyping = true; // lock sending

        const typingInterval = setInterval(() => {
          if (index < text.length) {
            response.textContent += text.charAt(index);
            index++;
          } else {
            clearInterval(typingInterval);

            // After typing is done, wait 10 seconds then fade out
            setTimeout(() => {
              response.style.transition = 'opacity 2s';
              response.style.opacity = 0;

              // Clear text after fade-out
              setTimeout(() => {
                response.textContent = '';
                response.style.opacity = 1;
                isTyping = false; // unlock sending after done
              }, 2000);
            }, 2000);
          }
        }, 100); // typing speed
      }
    });
  </script>

</body>
</html>
